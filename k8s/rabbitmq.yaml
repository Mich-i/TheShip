# RabbitMQ-Broker fuer den Scanner (Aufgabe Scanner).
# Der Scanner verbindet sich mit <K8S_HOST>:2014 und den pika-Standard-Credentials guest/guest.
# Das offizielle Image erlaubt guest bereits von ausserhalb localhost (loopback_users.guest = false).
# Eigener Namespace, damit ein "reinstall" im Installer (theship-vendor) nichts davon loescht.
# Anwenden: sudo k3s kubectl apply -f k8s/rabbitmq.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: rabbitmq
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4
          ports:
            - containerPort: 5672
          resources:
            limits:
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 10
            periodSeconds: 5
---
# NodePort wie bei den Schiffsmodulen (k3s: service-node-port-range 2000-32000)
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: rabbitmq
spec:
  type: NodePort
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 2014
      targetPort: 5672
      nodePort: 2014
